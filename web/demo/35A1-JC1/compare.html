  #infocard h3 { margin: 0 0 6px; font-size: 13px; color: #8ab4f8; }

  /* 右下：图例 */

<body>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// ---------------------------------------------------------------- 渲染骨架
// Phase 6.6：渐变天空背景 + 金属材质 + 阴影 + 抗锯齿 + 地面网格
const scene = new THREE.Scene();
scene.background = (() => {
  const c = document.createElement('canvas'); c.width = 2; c.height = 256;
  const g = c.getContext('2d');
  const grad = g.createLinearGradient(0, 0, 0, 256);
  grad.addColorStop(0, '#33415a'); grad.addColorStop(0.55, '#1c242f'); grad.addColorStop(1, '#0d1015');
  g.fillStyle = grad; g.fillRect(0, 0, 2, 256);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
})();
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 10, 500000);
camera.up.set(0, 0, 1);
camera.position.set(15000, 10000, 20000);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));   // 6.6 性能红线
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.getElementById('viewer').appendChild(renderer.domElement);

// 6.6 关键：高 metalness 的 PBR 金属没有环境反射就只剩高光（发黑）——
// 用 RoomEnvironment 生成中性棚拍环境贴图，金属质感才立得住。
{
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
}

const hemi = new THREE.HemisphereLight(0xdfe8ff, 0x30363f, 1.15);
scene.add(hemi);
const dir1 = new THREE.DirectionalLight(0xfff4e0, 2.2);   // 主光（带阴影）
dir1.castShadow = true;
dir1.shadow.mapSize.set(2048, 2048);
dir1.shadow.bias = -0.0002;
scene.add(dir1); scene.add(dir1.target);
const dir2 = new THREE.DirectionalLight(0x9ab4ff, 0.55);  // 冷色补光
dir2.position.set(-2, -3, -2); scene.add(dir2);
const controls = new OrbitControls(camera, renderer.domElement);

// 地面：参考网格 + 阴影承接面（可开关）
const ground = new THREE.Group();
ground.name = 'ground';
let gridHelper = null, shadowPlane = null;
function buildGround(zMin, radius) {
  if (gridHelper) { ground.remove(gridHelper); gridHelper.geometry.dispose(); }
  if (shadowPlane) { ground.remove(shadowPlane); shadowPlane.geometry.dispose(); }
  const size = Math.max(4, Math.ceil(radius * 2.6 / 1000) * 1000);
  gridHelper = new THREE.GridHelper(size, 30, 0x3d485a, 0x232a35);
  gridHelper.rotation.x = Math.PI / 2;              // three 默认 XZ，camera.up=Z → 转到 XY
  gridHelper.position.set(0, 0, zMin - 600);
  shadowPlane = new THREE.Mesh(
    new THREE.PlaneGeometry(size * 2, size * 2),
    new THREE.ShadowMaterial({ opacity: 0.28 }));
  shadowPlane.position.set(0, 0, zMin - 590);
  shadowPlane.receiveShadow = true;
  ground.add(gridHelper); ground.add(shadowPlane);
}
scene.add(ground);

const loader = new GLTFLoader();
const BASE = 'latest_deliver/';

// ---------------------------------------------------------------- 数据资产
const DATA = {};   // barMap / model / multi / byRole / byOrigin / review / diffReport / detailMap
const MESHES = {}; // skeleton | diff | gt | detail → THREE.Group
let currentKey = null;
let reviewGroupObj = null;
let BARINFO = {};  // component_id → bar_map 记录（含 section，点击信息卡用）

async function fetchJSON(name) {
  const r = await fetch(BASE + name, { cache: 'no-store' });
  if (!r.ok) throw new Error(`${name}: HTTP ${r.status}`);
  return r.json();
}
async function fetchJSONRel(url) {
  const r = await fetch(url, { cache: 'no-store' });
  if (!r.ok) throw new Error(`${url}: HTTP ${r.status}`);
  return r.json();
}
// ------------------------------------------------- P0：字节级加载 + SHA-256
// 刷新后不再吃 HTTP 缓存旧资产（cache:'no-store'），并实测字节哈希与
// version.json 指纹比对 —— 「网页加载的就是 out/ 刚生成的那个文件」。
const SHA256 = {};   // url → 浏览器端实测 sha256 hex
async function sha256Hex(buf) {
  if (!crypto.subtle) return null;   // 非安全上下文（http 非 localhost）
  const h = await crypto.subtle.digest('SHA-256', buf);
  return [...new Uint8Array(h)].map(b => b.toString(16).padStart(2, '0')).join('');
}
async function fetchBytes(url) {
  const r = await fetch(url, { cache: 'no-store' });
  if (!r.ok) throw new Error(`${url}: HTTP ${r.status}`);
  const buf = await r.arrayBuffer();
  SHA256[url] = await sha256Hex(buf);
  return buf;
}
function fixNormals(scene) {
  // trimesh 导出的 GLB 不带 NORMAL 属性；MeshStandardMaterial 缺法线会渲染成纯黑
  // （大平面如节点板尤其明显）。加载时一次性补算顶点法线。
  scene.traverse(o => {
    if (o.isMesh && o.geometry && !o.geometry.attributes.normal) {
      o.geometry.computeVertexNormals();
    }
  });
}
async function loadGLB(url) {
  const buf = await fetchBytes(url);
  return new Promise((res, rej) => loader.parse(buf, '', (g) => {
    fixNormals(g.scene);
    res(g.scene);
  }, rej));
}
const $ = id => document.getElementById(id);
function setLoading(on, text) { $('loading').style.display = on ? 'block' : 'none'; if (text) $('loading').textContent = text; }

// ------------------------------------------------- component_id → 属性映射
// Phase 6.6：来源分组配色改为金属质感口径（银/蓝/黄/暗灰），图例同步
const ORIGIN_GROUPS = {
  recognized: { label: '识别',   color: '#cdd3da', origins: ['dxf_geom'] },
  assisted:   { label: '辅助重建', color: '#3f6fd8', origins: ['diaphragm_reconstructed', 'panel_subdivision'] },
  stitch:     { label: '拼接',   color: '#d8b62a', origins: ['collinear_stitch'] },
  derived:    { label: '派生',   color: '#5a6068', origins: ['derived_4face'] },
  // P4：底段参数化外推（z<6500 无图纸来源）——半透明紫，图例带免责声明
  parametric: { label: '参数化底段', color: '#a855f7', origins: ['derived_parametric_base'] },
};
const originToGroup = {};
for (const [g, def] of Object.entries(ORIGIN_GROUPS))
  for (const o of def.origins) originToGroup[o] = g;

// 6.6 材质：金属度/粗糙度区分来源
const MATS = {
  recognized: new THREE.MeshStandardMaterial({ color: 0xcdd3da, metalness: 0.85, roughness: 0.30 }),
  assisted:   new THREE.MeshStandardMaterial({ color: 0x3f6fd8, metalness: 0.55, roughness: 0.45 }),
  stitch:     new THREE.MeshStandardMaterial({ color: 0xd8b62a, metalness: 0.70, roughness: 0.35 }),
  derived:    new THREE.MeshStandardMaterial({ color: 0x5a6068, metalness: 0.15, roughness: 0.85 }),
  // P4：参数化底段——半透明紫（结构分类 parametric_leg/cross 仅示意，
  // 非图纸识别），不遮挡上层图纸来源构件
  parametric: new THREE.MeshStandardMaterial({ color: 0xa855f7, metalness: 0.20, roughness: 0.70,
    transparent: true, opacity: 0.55, depthWrite: false }),
  galvanized: new THREE.MeshStandardMaterial({ color: 0xb0b6c0, metalness: 0.85, roughness: 0.40,
    emissive: 0x333a45, envMapIntensity: 1.8 }),   // 任务书钉死 0.85/0.4；emissive 兜底大平面反射暗区发黑
  darksteel:  new THREE.MeshStandardMaterial({ color: 0x262a31, metalness: 0.60, roughness: 0.55 }),
  stubblue:   new THREE.MeshStandardMaterial({ color: 0x7aa0d8, metalness: 0.65, roughness: 0.45,
    emissive: 0x1a2028 }),
};
const GHOST = new THREE.MeshStandardMaterial({
  color: 0x8a9099, transparent: true, opacity: 0.10, roughness: 0.9, metalness: 0, depthWrite: false });

const ROLE_LABELS = { LEG: '主腿', DIAG: '斜材', HORIZ: '水平材', CROSS: '横担', DIA: '横隔' };
const ORIGIN_LABELS = {
  dxf_geom: 'DXF 直接识别', diaphragm_reconstructed: '横隔重建（标高辅助）',
  panel_subdivision: '主腿节间化', collinear_stitch: '共线拼接', derived_4face: '四面派生展示',
  // P4：底段参数化外推（免责声明数据面）
  derived_parametric_base: '参数化外推（无图纸来源，示意性补全）',
};

function sheetOf(cid) {
  const m = String(cid).match(/35A1-JC1-(\d{2})/);
  if (m) return m[1];
  if (String(cid).startsWith('4f_diaphragm')) return 'dia';
  return 'other';
}
function roleKeyOf(attrs, cid) {
  if (String(cid).startsWith('4f_diaphragm')) return 'DIA';
  return attrs && attrs.role ? attrs.role : null;
}

function buildAttrs(barMap) {
  const attrs = {};
  for (const e of barMap) {
    const cid = String(e.component_id);
    attrs[cid] = {
      role: e.role, origin: e.geometry_origin, section: e.section ?? null,
      group: originToGroup[e.geometry_origin] || null,
      sheet: sheetOf(cid),
      isReview: cid.startsWith('review_'),
    };
  }
  return attrs;
}

// 给骨架 mesh 按来源组换金属材质（缓存原材质供选中/还原）
function applyProvenanceMaterials(group) {
  group.traverse(obj => {
    if (!obj.isMesh) return;
    const name = meshNameOf(obj);
    const a = ATTRS[name];
    obj.userData.origMat = obj.material;
    obj.castShadow = true;
    if (a && a.group && MATS[a.group]) obj.material = MATS[a.group];
  });
}

// ---------------------------------------------------------------- 过滤状态
const state = {
  mode: 'model',           // model | diff | detail | gt
  origins: new Set(Object.keys(ORIGIN_GROUPS)),
  sheets: new Set(),
  roles: new Set(Object.keys(ROLE_LABELS)),
  review: true,
  grid: true,
  diffGroups: new Set(['added', 'removed', 'moved', 'unchanged']),
  gtOverlay: 'off',         // P2：off | overlay | only（GT 半透明叠加）
  zLo: null, zHi: null,     // P2：高度切片（null=不限）
};
let ATTRS = {};
let SHEETS = [];
let ZBOUNDS = { lo: 0, hi: 40000 };   // init 从 model.json 节点 z 现算
let selected = null;       // 当前选中 mesh

// P2：mesh 的 z 中点（GLB 顶点已烘焙变换，取几何包围盒中心）——缓存
function zMidOf(obj) {
  if (obj.userData.zMid == null) {
    if (!obj.geometry.boundingBox) obj.geometry.computeBoundingBox();
    const bb = obj.geometry.boundingBox;
    obj.userData.zMid = bb ? (bb.min.z + bb.max.z) / 2 : null;
  }
  return obj.userData.zMid;
}
function inZSlice(obj) {
  if (state.zLo == null && state.zHi == null) return true;
  const zm = zMidOf(obj);
  if (zm == null) return true;
  if (state.zLo != null && zm < state.zLo) return false;
  if (state.zHi != null && zm > state.zHi) return false;
  return true;
}

function meshNameOf(obj) {
  // GLTFLoader 的 sanitizeNodeName 会剥掉点号等保留字符（横隔 id "…06500.0_00" 被改坏），
  // 但原始 node 名保留在 obj.userData.name —— 优先用它，兜底向上找父级。
  let o = obj;
  while (o) {
    const raw = (o.userData && o.userData.name) || o.name;
    if (raw && ATTRS[raw]) return raw;
    o = o.parent;
  }
  return (obj.userData && obj.userData.name) || obj.name || '';
}

function applyModelFilters() {
  const grp = MESHES.skeleton;
  if (!grp) return;
  let visible = 0, total = 0;
  grp.traverse(obj => {
    if (!obj.isMesh) return;
    const name = meshNameOf(obj);
    const a = ATTRS[name];
    if (!a) { obj.visible = true; return; }
    total++;
    if (a.isReview) { obj.visible = false; return; }   // 红球由 reviewGroup 统一画
    let v = true;
    if (a.group) v = v && state.origins.has(a.group);
    v = v && state.sheets.has(a.sheet);
    const rk = roleKeyOf(a, name);
    if (rk) v = v && state.roles.has(rk);
    v = v && inZSlice(obj);                       // P2 高度切片
    obj.visible = v;
    if (v) visible++;
  });
  $('visibleCount').textContent = `可见 ${visible}/${total - countReviewAttrs()}`;
}
function countReviewAttrs() { return Object.values(ATTRS).filter(a => a.isReview).length; }

function applyDiffFilters() {
  const grp = MESHES.diff;
  if (!grp || !DATA.diffReport) return;
  const added = new Set(DATA.diffReport.added || []);
  const removed = new Set(DATA.diffReport.removed || []);
  // P2 第四类「待复核」：moved_within_tol（位置微调 <tol 的杆）→ 橙色
  const moved = new Set((DATA.diffReport.moved_within_tol || []).map(e => String(e[1])));
  grp.traverse(obj => {
    if (!obj.isMesh) return;
    const name = (obj.userData && obj.userData.name) || obj.name || meshNameOf(obj);
    let g = 'unchanged';
    if (added.has(name)) g = 'added';
    else if (removed.has(name)) g = 'removed';
    else if (moved.has(name)) g = 'moved';
    obj.userData.diffGroup = g;
    obj.visible = state.diffGroups.has(g) && inZSlice(obj);
    if ((g === 'unchanged' || g === 'moved') && obj.userData.alphaApplied !== g) {
      obj.material = obj.material.clone ? obj.material.clone() : obj.material;
      obj.material.transparent = true;
      obj.material.opacity = 0.45;
      if (g === 'moved') {   // 灰顶点色覆盖为橙（关 vertexColors 才能显材质色）
        obj.material.vertexColors = false;
        obj.material.color = new THREE.Color(0xff9d2e);
        obj.material.needsUpdate = true;
      }
      obj.userData.alphaApplied = g;
    }
  });
}

function applyFilters() {
  if (state.mode === 'model') applyModelFilters();
  else if (state.mode === 'diff') applyDiffFilters();
  if (reviewGroupObj) reviewGroupObj.visible = state.review && (state.mode === 'model' || state.mode === 'diff');
  ground.visible = state.grid && state.mode !== 'detail';
  updateGtOverlay();
  renderLegend();
}

// ---------------- P2：GT 半透明叠加（独立组，可与 model/diff 共存） ----------------
let gtOverlayLoading = false;
function ensureGtOverlay() {
  if (MESHES.gtoverlay || gtOverlayLoading) return;
  gtOverlayLoading = true;
  loadGLB('gt_reference.glb').then(g => {
    g.traverse(o => {
      if (!o.isMesh) return;
      o.material = o.material.clone ? o.material.clone() : o.material;
      o.material.transparent = true;
      o.material.opacity = 0.25;
      o.material.depthWrite = false;
    });
    MESHES.gtoverlay = g;   // 不走 attach()：attach 的组会被模式切换移除
    gtOverlayLoading = false;
    applyFilters();
  }).catch(() => { gtOverlayLoading = false; });
}
function updateGtOverlay() {
  const active = state.mode === 'model' || state.mode === 'diff';
  const want = active && state.gtOverlay !== 'off';
  const mainGrp = currentKey ? MESHES[currentKey] : null;
  if (mainGrp) mainGrp.visible = !(want && state.gtOverlay === 'only');
  if (!want) { if (MESHES.gtoverlay) MESHES.gtoverlay.visible = false; return; }
  if (!MESHES.gtoverlay) { ensureGtOverlay(); return; }
  if (!MESHES.gtoverlay.parent) scene.add(MESHES.gtoverlay);
  MESHES.gtoverlay.visible = true;
}

// ---------------------------------------------------------------- 点击拾取（6.4b / 6.5b）
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
let downAt = null;

renderer.domElement.addEventListener('pointerdown', e => {
  downAt = { x: e.clientX, y: e.clientY, t: performance.now() };
});
renderer.domElement.addEventListener('pointerup', e => {
  if (!downAt) return;
  const moved = Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y);
  const dt = performance.now() - downAt.t;
  downAt = null;
  if (moved > 5 || dt > 500) return;                 // 拖拽/长按不算点击
  pickAt(e.clientX, e.clientY);
});

function pickAt(cx, cy) {
  const rect = renderer.domElement.getBoundingClientRect();
  pointer.x = ((cx - rect.left) / rect.width) * 2 - 1;
  pointer.y = -((cy - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  let target = null;
  if (state.mode === 'model' && MESHES.skeleton) target = MESHES.skeleton;
  else if (state.mode === 'detail' && MESHES.detail) target = MESHES.detail;
  if (!target) { clearSelection(); hideInfoCard(); return; }
  const hits = raycaster.intersectObject(target, true).filter(h => h.object.isMesh && h.object.visible);
  if (!hits.length) { clearSelection(); hideInfoCard(); return; }
  const obj = hits[0].object;
  if (state.mode === 'model') selectBar(obj);
  else showDetailCard(obj);
}

function selectBar(obj) {
  clearSelection();
  selected = obj;
  const grp = MESHES.skeleton;
  grp.traverse(o => {
    if (!o.isMesh) return;
    if (o === obj) {
      const m = (o.userData.origMat || o.material).clone();
      m.emissive = new THREE.Color(0x4a7bff);
      m.emissiveIntensity = 0.85;
      o.material = m;
    } else {
      o.material = GHOST;
    }
  });
  const name = meshNameOf(obj);
  showBarCard(name, obj);
}
function clearSelection() {
  if (!selected) return;
  const grp = MESHES.skeleton;
  if (grp) grp.traverse(o => {
    if (o.isMesh && o.userData.origMat) o.material = o.userData.origMat;
  });
  selected = null;
}

// ---- 截面解析与 SVG（L40X3 → 肢40×厚3；Q345L100X7 去材质前缀） ----
function parseSection(raw) {
  if (!raw) return null;
  const m = String(raw).match(/^(?:Q(\d+))?L(\d+(?:\.\d+)?)X(\d+(?:\.\d+)?)$/);
  if (!m) return null;
  return { material: m[1] ? 'Q' + m[1] : null, leg: parseFloat(m[2]), thick: parseFloat(m[3]) };
}
function sectionSvg(sec) {
  // L 形：leg×leg 外框挖掉 (leg-t)×(leg-t) 右上角，缩放到 92px
  const S = 92, k = S / sec.leg, t = Math.max(2.5, sec.thick * k), L = S;
  const inner = L - t;
  const path = `M0 0 H${L} V${t} H${inner} V${L} H0 Z`;
  return `<svg width="${S + 46}" height="${S + 30}" viewBox="-4 -4 ${S + 50} ${S + 34}">
    <path d="${path}" fill="#9fb6d8" stroke="#dbe6f5" stroke-width="1"/>
    <text x="${L / 2}" y="${S + 18}" fill="#9aa4b2" font-size="11" text-anchor="middle">肢宽 ${sec.leg}mm</text>
    <text x="${L + 8}" y="${t / 2 + 4}" fill="#9aa4b2" font-size="11">厚 ${sec.thick}mm</text>
  </svg>`;
}

function showBarCard(cid) {
  const a = ATTRS[cid];
  const info = BARINFO[cid] || {};
  if (!a) { hideInfoCard(); return; }
  const sec = parseSection(a.section);

       <div class="row"><span class="k">肢宽 × 厚</span><span class="v">${sec.leg} × ${sec.thick} mm${sec.material ? '（' + sec.material + '）' : ''}</span></div>
       ${sectionSvg(sec)}`
    : `<div class="row"><span class="k">截面规格</span><span class="v warn" style="color:#f0b429">未关联（BOM 件号未对上）</span></div>`;
  $('infocard').innerHTML = `

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

// ---------------------------------------------------------------- 复核红球
function buildReviewSpheres(review) {
  const grp = new THREE.Group();
  grp.name = 'reviewGroup';
  const seen = new Set();
  const dotTex = (() => {
    const c = document.createElement('canvas'); c.width = c.height = 64;
    const g = c.getContext('2d');
    const grad = g.createRadialGradient(32, 32, 2, 32, 32, 30);
    grad.addColorStop(0, 'rgba(255,60,60,1)'); grad.addColorStop(1, 'rgba(255,60,60,0)');
    g.fillStyle = grad; g.fillRect(0, 0, 64, 64);
    return new THREE.CanvasTexture(c);
  })();
  for (const grpEntry of (review.groups || [])) {
    for (const ent of (grpEntry.entries || [])) {
      const xyz = ent.xyz_mm;
      if (!xyz || xyz.length !== 3) continue;
      const key = ent.node_id || xyz.join(',');
      if (seen.has(key)) continue;
      seen.add(key);
      const pos = new THREE.Vector3(xyz[0], xyz[1], xyz[2]);
      const ball = new THREE.Mesh(
        new THREE.SphereGeometry(80, 16, 12),
        new THREE.MeshBasicMaterial({ color: 0xff2828 }));
      ball.position.copy(pos);
      const sprite = new THREE.Sprite(new THREE.SpriteMaterial({
        map: dotTex, sizeAttenuation: false, depthTest: false, transparent: true }));
      sprite.position.copy(pos);
      sprite.scale.set(0.02, 0.02, 1);
      grp.add(ball); grp.add(sprite);
    }
  }
  return grp;
}

function checkbox(parentId, key, label, checked, onChange, swColor) {
  const lab = document.createElement('label');
  const cb = document.createElement('input');
  cb.type = 'checkbox'; cb.checked = checked; cb.dataset.key = key;
  cb.addEventListener('change', () => onChange(key, cb.checked));
  lab.appendChild(cb);
  if (swColor) {
    const sw = document.createElement('span');
    sw.className = 'sw'; sw.style.background = swColor;
    lab.appendChild(sw);
  }
  lab.appendChild(document.createTextNode(label));
  document.getElementById(parentId).appendChild(lab);
  return cb;
}

function buildLayerPanel() {
  $('originFilters').innerHTML = '';

    });

  $('roleFilters').innerHTML = '';
  for (const [r, label] of Object.entries(ROLE_LABELS))
    checkbox('roleFilters', r, label, true, (k, v) => {

    });

  // ---- P2：高度切片滑杆 ----
  const zl = $('zLo'), zh = $('zHi');
  zl.min = zh.min = ZBOUNDS.lo; zl.max = zh.max = ZBOUNDS.hi;
  zl.value = ZBOUNDS.lo; zh.value = ZBOUNDS.hi;
  const onZ = () => {
    let lo = +zl.value, hi = +zh.value;
    if (lo > hi) { if (document.activeElement === zl) { hi = lo; zh.value = hi; } else { lo = hi; zl.value = lo; } }
    state.zLo = lo <= ZBOUNDS.lo ? null : lo;
    state.zHi = hi >= ZBOUNDS.hi ? null : hi;
    $('zread').textContent = `z∈[${Math.round(lo)},${Math.round(hi)}]`;
    applyFilters();
  };
  zl.addEventListener('input', onZ);
  zh.addEventListener('input', onZ);

  // ---- P2：图纸切片下拉（单选快筛，与复选框共存） ----
  const sel = $('sheetSelect'); sel.innerHTML = '';
  const addOpt = (v, t) => { const o = document.createElement('option'); o.value = v; o.textContent = t; sel.appendChild(o); };
  addOpt('all', '全部册');
  for (const s2 of SHEETS) if (s2 !== 'other')
    addOpt(s2, s2 === 'dia' ? '横隔（无分册）' : `${s2} 分册`);
  addOpt('base', '底段（z<6500 参数化）');
  addOpt('custom', '自定义（看上方复选框）');
  sel.onchange = () => {
    const v = sel.value;
    if (v === 'all') { state.sheets = new Set(SHEETS); zl.value = ZBOUNDS.lo; zh.value = ZBOUNDS.hi; onZ(); }
    else if (v === 'base') {
      state.sheets = new Set(SHEETS);
      const cap = DATA.multi?.effective?.z_min_mm ?? 6500;
      zl.value = ZBOUNDS.lo; zh.value = Math.max(ZBOUNDS.lo, cap - 1); onZ();
    }
    else if (v !== 'custom') { state.sheets = new Set([v]); }
    else return;
    syncSheetChecks(); applyFilters();
  };

  // ---- P2：GT 叠加选择 ----
  $('gtOverlay').onchange = e => { state.gtOverlay = e.target.value; applyFilters(); };

  $('markFilters').innerHTML = '';
  checkbox('markFilters', 'review', '复核红球', true, (k, v) => {
    state.review = v; applyFilters();
  }, '#ff2828');
  checkbox('markFilters', 'grid', '地面网格', true, (k, v) => {
    state.grid = v; applyFilters();
  });

  $('btn-reset').onclick = () => {
    state.origins = new Set(Object.keys(ORIGIN_GROUPS));
    state.sheets = new Set(SHEETS);
    state.roles = new Set(Object.keys(ROLE_LABELS));
    state.review = true;
    state.grid = true;
    state.diffGroups = new Set(['added', 'removed', 'moved', 'unchanged']);
    state.gtOverlay = 'off'; $('gtOverlay').value = 'off';
    state.zLo = null; state.zHi = null;
    $('zLo').value = ZBOUNDS.lo; $('zHi').value = ZBOUNDS.hi; $('zread').textContent = '';
    $('sheetSelect').value = 'all';
    document.querySelectorAll('#layers input[type=checkbox]').forEach(cb => cb.checked = true);
    applyFilters();
  };
}

// ---------------------------------------------------------------- 统计面板
function fmtPct(x, digits = 1) { return x == null ? '—' : (x * 100).toFixed(digits) + '%'; }
function sweepAt(cal, tol) {
  const c = DATA.multi?.calibers?.[cal];
  if (!c) return null;
  return (c.sweep || []).find(s => Math.abs(s.tol - tol) < 1e-6) || null;
}
function renderStats() {
  const lines = [];
  if (DATA.model) {
    let bars = 0, nodes = 0, zmin = Infinity, zmax = -Infinity;
    for (const c of Object.values(DATA.model.components)) {
      if (c.kind === 'tower_bar') bars++;
      else if (c.kind === 'tower_node') {
        nodes++;
        const z = Number(c.properties?.z || 0);
        if (z < zmin) zmin = z; if (z > zmax) zmax = z;
      }
    }
    lines.push(`<b>杆件 ${bars}</b> | 节点 ${nodes} | Z [${Math.round(zmin)}, ${Math.round(zmax)}]`);
  }
  if (DATA.barMap) {
    const cnt = { recognized: 0, assisted: 0, stitch: 0, derived: 0 };
    for (const e of DATA.barMap) {
      const g = originToGroup[e.geometry_origin];
      if (g) cnt[g]++;
    }
    const reviewN = DATA.review?.gate?.genuine_dangling_physical
      ?? (DATA.review?.groups || []).length ?? 0;
    lines.push(`识别 ${cnt.recognized} | 辅助 ${cnt.assisted} | 拼接 ${cnt.stitch} | 派生 ${cnt.derived} | 复核 ${reviewN}`);
    // 6.4：截面规格分布（bar_map.section 现算，null 归未关联）
    const secs = {};
    let unlinked = 0;
    for (const e of DATA.barMap) {
      if (String(e.component_id).startsWith('review_')) continue;
      if (e.section) secs[e.section] = (secs[e.section] || 0) + 1;
      else unlinked++;
    }
    const top = Object.entries(secs).sort((a, b) => b[1] - a[1]).slice(0, 6)
      .map(([s, n]) => `${s} ×${n}`);
    lines.push(`<span class="dim">截面: ${top.join(' · ')}${Object.keys(secs).length > 6 ? ` · +${Object.keys(secs).length - 6} 种` : ''} · 未关联 ${unlinked}</span>`);
  }
  if (DATA.multi) {
    const pure = sweepAt('pure', 500), full = sweepAt('full', 500);
    const seg = [];
    if (pure) seg.push(`A2-pure TP@500=${pure.tp} (P=${fmtPct(pure.precision)})`);
    if (full) seg.push(`A2-full TP@500=${full.tp} (P=${fmtPct(full.precision)})`);
    const ceil = DATA.multi.ceiling;
    if (ceil?.ceiling_rate != null) seg.push(`front 上限 ${fmtPct(ceil.ceiling_rate)}`);
    if (seg.length) lines.push(seg.join(' | '));
    const zmin = DATA.multi.effective?.z_min_mm;
    if (zmin != null) lines.push(`<span class="warn">缺失区间: z &lt; ${zmin}（底段无图源，A2-effective 已剔除）</span>`);
  }
  if (DATA.byRole) {
    const parts = Object.entries(DATA.byRole)
      .map(([r, v]) => `${r} ${fmtPct(v.recall, 1)}`);
    if (parts.length) lines.push(`<span class="dim">分角色召回: ${parts.join(' · ')}</span>`);
  }
  if (state.mode === 'diff' && DATA.diffReport) {
    const s = DATA.diffReport.summary || {};
    lines.push(`<b>diff（tol=${DATA.diffReport.tol_mm}mm）</b>：新增 ${s.added ?? 0} · 删除 ${s.removed ?? 0} · 待复核 ${(DATA.diffReport.moved_within_tol || []).length} · 未变 ${s.unchanged ?? 0}`);
  }
  if (state.mode === 'detail' && DATA.detailMap && DATA.detailMap.length) {
    const plate = DATA.detailMap.find(e => e.kind === 'gusset_plate');
    if (plate) lines.push(`<b>节点详图 ${esc(plate.detail_id)}</b>：${plate.n_holes} 孔 · ${plate.n_groups} 螺栓组 · 板厚 ${plate.plate_thickness_mm}mm${plate.thickness_assumed ? '（假定）' : ''}`);
  }
  lines.push(fpsLine());
  $('stats').innerHTML = lines.join('<br>') || '无数据';
}

}
function showMode(mode) {
  if (currentKey) scene.remove(MESHES[currentKey]);
  const lazy = {
    gt: () => loadGLB('gt_reference.glb').then(g => attach('gt', g)),
    diff: () => Promise.all([loadGLB(BASE + 'diff.glb'),
                             fetchJSON('diff_report.json').catch(() => null)])
      .then(([g, rep]) => { DATA.diffReport = rep; attach('diff', g); }),
    detail: () => Promise.all([loadGLB('detail_sample.glb'),
                               fetchJSONRel('detail_sample.bar_map.json').catch(() => [])])
      .then(([g, map]) => {
        DATA.detailMap = map;
        applyDetailMaterials(g, map);
        attach('detail', g);
      }),
  };
  if (lazy[mode] && !MESHES[mode]) {
    setLoading(true, `加载${mode === 'gt' ? ' GT 官方塔' : mode === 'diff' ? ' diff.glb' : '节点板样例'}…`);
    lazy[mode]()
      .then(() => finishShow(mode))
      .catch(() => {
        $('desc').textContent = mode === 'diff'
          ? 'diff.glb 缺失：先跑 scripts/generate_diff_glb.py + sync'
          : mode === 'detail'
            ? 'detail_sample.glb 缺失：先跑 scripts/build_detail_sample.py'
            : 'GT 加载失败';
        setLoading(false);
      });
    return;
  }
  finishShow(mode);
}
function applyDetailMaterials(group, map) {
  const kindOf = {};
  for (const e of (map || [])) kindOf[String(e.component_id)] = e.kind;
  group.traverse(obj => {
    if (!obj.isMesh) return;
    const name = (obj.userData && obj.userData.name) || obj.name || '';
    const kind = kindOf[name];
    obj.castShadow = true;
    if (kind === 'gusset_plate') obj.material = MATS.galvanized;
    else if (kind === 'bolt_holes') obj.material = MATS.darksteel;
    else if (kind === 'bar_stub_schematic') obj.material = MATS.stubblue;
  });
}
function finishShow(mode) {
  const key = { gt: 'gt', diff: 'diff', detail: 'detail' }[mode] || 'skeleton';
  const grp = MESHES[key];
  if (grp) {
    scene.add(grp);
    currentKey = key;
    const box = new THREE.Box3().setFromObject(grp);
    const c = box.getCenter(new THREE.Vector3());
    const s = box.getSize(new THREE.Vector3()).length() / 2 || 1;
    if (mode === 'detail') {
      // 样例场景：俯视对准板中心（bbox 中心被高示意杆拉偏）
      const plateC = new THREE.Vector3(0, 0, 4);
      camera.position.copy(plateC).add(new THREE.Vector3(s * 0.9, -s * 0.9, s * 1.15));
      controls.target.copy(plateC);
    } else {
      camera.position.copy(c).add(new THREE.Vector3(s * 1.0, s * 0.25, s * 0.7));
      controls.target.copy(c);
    }
    // 主光阴影相机贴合当前模型包围盒
    dir1.position.copy(c).add(new THREE.Vector3(s * 1.5, s * 1.2, s * 2.2));
    dir1.target.position.copy(c);
    const sc = dir1.shadow.camera;
    sc.left = sc.bottom = -s * 1.3; sc.right = sc.top = s * 1.3;
    sc.near = 1; sc.far = s * 8;
    sc.updateProjectionMatrix();
    if (mode !== 'detail') buildGround(box.min.z, Math.max(box.getSize(new THREE.Vector3()).x, box.getSize(new THREE.Vector3()).y) / 2);
  }
  setLoading(false);
  applyFilters();
  renderStats();
}

// ---------------------------------------------------------------- FPS 与自动降级（6.6 性能红线）
let frames = 0, lastSec = performance.now(), fps = 60, lowSecs = 0;
const degrade = { shadows: false, ratio: false };
function fpsLine() {
  const q = degrade.shadows || degrade.ratio
    ? ` <span class="warn">已自动降级(${degrade.shadows ? '关阴影' : ''}${degrade.shadows && degrade.ratio ? '+' : ''}${degrade.ratio ? '降分辨率' : ''})</span>` : '';
  return `<span class="${fps >= 30 ? 'ok' : 'warn'}">FPS ${fps.toFixed(0)}</span>${q}`;
}
function tickFps(now) {
  frames++;
  if (now - lastSec >= 1000) {
    fps = frames * 1000 / (now - lastSec);
    frames = 0; lastSec = now;
    if (fps < 30 && currentKey) {
      lowSecs++;
      if (lowSecs >= 3 && !degrade.shadows) {
        degrade.shadows = true;
        renderer.shadowMap.enabled = false;
        scene.traverse(o => { if (o.isMesh && o.material && o.material.needsUpdate !== undefined) o.material.needsUpdate = true; });
        renderStats();
      } else if (lowSecs >= 6 && !degrade.ratio) {
        degrade.ratio = true;
        renderer.setPixelRatio(1);
        renderStats();
      }
    } else if (fps >= 30) lowSecs = 0;
    if (currentKey) renderStats();
  }
}

// ---------------------------------------------------------------- 启动
// P0：运行信息条（version.json 指纹 + 浏览器端 SHA 实测）
function fmtTime(iso) {
  if (!iso) return '—';
  try { return new Date(iso).toLocaleString('zh-CN', { hour12: false }); } catch { return iso; }
}
function shaBadge(label, url, expect) {
  const got = SHA256[url];
  if (expect == null) return `<span class="sha na" title="version.json 未提供该指纹">${label} 未固定</span>`;
  if (got == null) return `<span class="sha na" title="本环境无 crypto.subtle，无法实测">${label} 无法实测</span>`;
  const ok = got === expect;
  return `<span class="sha ${ok ? 'ok' : 'bad'}" title="期望 ${expect}&#10;实测 ${got}">${label} ${ok ? '✓' : '✗'} ${got.slice(0, 8)}</span>`;
}
function renderRunbar() {
  const v = DATA.version, el = $('runbar');
  if (!v) {
    el.innerHTML = '<span class="warn">version.json 缺失：先跑 run_35A1_jc1_full.py（P0 收口链自动 sync）</span>';
    return;
  }
  const short = s => (s || '—').slice(0, 8);
  const a2 = v.a2 || {}, seg = [];
  if (a2.pure) seg.push(`A2-pure TP@500=<b>${a2.pure.tp500}</b>`);
  if (a2.level_assisted) seg.push(`assisted=${a2.level_assisted.tp500}`);
  if (a2.parametric) seg.push(`param=${a2.parametric.tp500}`);
  if (a2.full) seg.push(`A2-full=<b>${a2.full.tp500}</b>`);
  const base = v.base_segment || {};
  const baseSeg = base.bars != null
    ? ` · 底段：参数化外推 ${base.bars} 根${base.z_range_mm ? ` z∈[${Math.round(base.z_range_mm[0])},${Math.round(base.z_range_mm[1])}]` : ''}（非 DXF 识别，不计 A2-pure）` : '';
  el.innerHTML =
    `run <b>${short(v.run_id)}</b> · git <b>${short(v.git_sha)}${v.git_dirty ? '*' : ''}</b>` +
    ` · ${fmtTime(v.generated_at)} · 杆件 <b>${v.model_components ?? '—'}</b> / 节点 <b>${v.model_nodes ?? '—'}</b>` +
    (seg.length ? ` · ${seg.join(' · ')}` : '') + baseSeg + '<br>' +
    `${shaBadge('model.json', BASE + 'model.json', v.model_sha)} ${shaBadge('skeleton.glb', BASE + 'skeleton.glb', v.skeleton_sha)}` +
    ' · <span class="dim">刷新即校验（no-store 直读 + SHA-256 实测）</span>';
}

(async function init() {
  setLoading(true, '加载数据资产…');
  try {
    const [barMap, modelBuf, multi, byRole, byOrigin, review, version] = await Promise.all([
      fetchJSON('bar_map.json'),
      fetchBytes(BASE + 'model.json'),     // P0：字节级加载 + SHA 实测
      fetchJSON('metrics_multi_caliber.json').catch(() => null),
      fetchJSON('metrics_by_role.json').catch(() => null),
      fetchJSON('metrics_by_origin.json').catch(() => null),
      fetchJSON('review_queue.json').catch(() => null),
      fetchJSON('version.json').catch(() => null),
    ]);
    const model = JSON.parse(new TextDecoder().decode(modelBuf));
    Object.assign(DATA, { barMap, model, multi, byRole, byOrigin, review, version });
    ATTRS = buildAttrs(barMap);
    BARINFO = {};
    for (const e of barMap) BARINFO[String(e.component_id)] = e;
    SHEETS = [...new Set(Object.values(ATTRS).filter(a => !a.isReview).map(a => a.sheet))]
      .sort((a, b) => (a === 'dia' || a === 'other') - (b === 'dia' || b === 'other') || String(a).localeCompare(String(b)));
    state.sheets = new Set(SHEETS);
    { // P2：高度切片边界从 model.json 节点 z 现算（不硬编码）
      let zlo = Infinity, zhi = -Infinity;
      for (const c of Object.values(model.components)) {
        if (c.kind !== 'tower_node') continue;
        const z = Number(c.properties?.z || 0);
        if (z < zlo) zlo = z; if (z > zhi) zhi = z;
      }
      if (isFinite(zlo)) ZBOUNDS = { lo: Math.floor(zlo), hi: Math.ceil(zhi) };
    }
    buildLayerPanel();

    const skel = await loadGLB(BASE + 'skeleton.glb');
    applyProvenanceMaterials(skel);
    attach('skeleton', skel);
    reviewGroupObj = buildReviewSpheres(review || { groups: [] });
    scene.add(reviewGroupObj);
    renderRunbar();   // P0：骨架哈希已实测，出完整指纹条

    $('btn-model').onclick = () => setMode('model');
    $('btn-diff').onclick = () => setMode('diff');
    $('btn-detail').onclick = () => setMode('detail');
    $('btn-gt').onclick = () => setMode('gt');

    finishShow('model');
  } catch (e) {
    setLoading(false);
    $('stats').innerHTML = `<span class="warn">资产加载失败：${e.message}<br>请用 python3 -m http.server 8000 从仓库根启动，并先跑 scripts/sync_demo_assets.py</span>`;
  }
})();

function animate(now) {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
  tickFps(now || performance.now());
}
animate();
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
