<!DOCTYPE html>
<html lang="zh-CN">

<title>图纸↔3D 联动追溯 — Engineering Traceability</title>
<style>
  html, body { margin: 0; height: 100%; background: #10141c; overflow: hidden;
               font: 13px/1.5 ui-sans-serif, system-ui, "PingFang SC"; color: #dfe6f0; }

  #card h4 { margin: 0 0 6px; color: #ffd479; font-size: 14px; }

  #card td { padding: 2px 0; vertical-align: top; }

  svg .hl-bar { stroke: #ffd479 !important; stroke-width: 3 !important; }
  svg .hl-node { fill: #ff7d6e !important; }
  /* 点击 3D 杆 → 原生 CAD 图元黄色高亮 + 其余图元压暗（焦点模式） */
  svg .cad-hl { stroke: #ffd479 !important; stroke-width: 2.6 !important; }
  svg circle.cad-hl { fill: #ffd479 !important; stroke: #ffd479 !important; }
  svg text.cad-hl { fill: #ffd479 !important; stroke: none !important; }
  svg rect.cad-hl { fill: #ffd479 !important; stroke: none !important; }
  svg .cad-dim { opacity: 0.18; }
  svg #bg line, svg #bg path, svg #bg circle, svg #bg text, svg #bg rect { transition: opacity .15s linear; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"

<body>
<div id="wrap">
  <div id="left">
    <div id="tag">3D 加载中…</div>
    <div id="hint">左侧：点杆件 → 右侧图纸高亮对应实线 · 右侧：点黄色高亮线 → 3D 定位杆件</div>
  </div>
  <div id="divid" title="拖动调整分栏"></div>
  <div id="right">
    <div id="sheetbar"></div>
    <div id="svghost"></div>
    <div id="card"></div>
  </div>
</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// 塔配置：全部走同一管线产物（latest_deliver + trace SVG/overlay），
// 新增塔 = 追加一项 + 生成该塔 trace 资产，页面零改动。
const TOWERS = {
  '35A1-JC1': { label: '35A1-JC1 酒杯型转角塔', sheets: ['02', '04', '05', '06', '07'] },
  '35A2-ZC1': { label: '35A2-ZC1 干字型直线塔', sheets: ['05', '07', '08', '09', '10', '12'] },
};
let tower = '35A2-ZC1';   // 默认展示已净化塔型（R8 后 448 杆规范骨架）
// 相对路径：/site/trace.html 出发 → 本地 /demo/…、Pages /zotero/demo/… 两边通用
const BASE = () => `../demo/${tower}`;
const DELIVER = () => `${BASE()}/latest_deliver`;
const TRACE = () => `${BASE()}/trace`;

// ---------- 左：3D（skeleton.glb：一根杆一个 mesh，extras.component_id ↔ model.json） ----------
const left = document.getElementById('left');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x10141c);
const renderer = new THREE.WebGLRenderer({ antialias: true });
left.appendChild(renderer.domElement);
const camera = new THREE.PerspectiveCamera(40, 1, 10, 600000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
scene.add(new THREE.HemisphereLight(0xbfd4ee, 0x1a1f28, 1.1));
const key = new THREE.DirectionalLight(0xffffff, 1.8); key.position.set(1, 1.6, 0.8).multiplyScalar(60000);
scene.add(key);
const rim = new THREE.DirectionalLight(0x88aaff, 0.8); rim.position.set(-1.2, 0.6, -1).multiplyScalar(60000);
scene.add(rim);
scene.add(new THREE.GridHelper(120000, 60, 0x2b3850, 0x1a2230));

// 电力铁塔真实镀锌钢灰银色系：斜材亮银 / 主材冷钢银 / 横材中银
const ROLE_COLORS = { LEG: 0x94a3b8, DIAG: 0xe2e8f0, HORIZ: 0xcbd5e1, CROSS: 0xcbd5e1 };
const ROLE_SURFACE = {   // 真实镀锌角钢金属质感
  LEG: { metalness: 0.65, roughness: 0.38 },
  DIAG: { metalness: 0.60, roughness: 0.42 },
  HORIZ: { metalness: 0.55, roughness: 0.48 },
  CROSS: { metalness: 0.55, roughness: 0.48 },
};
const matCache = new Map();     // key: role|isDirect|dim → material
// role 归一化：evidence.json 的 role 沿用 eval 口径 HORIZONTAL，
// 着色表键是 HORIZ；无 role/未知值落 DIAG 斜材色（塔身主体观感）
function normRole(r) {
  if (!r) return 'DIAG';
  return r === 'HORIZONTAL' ? 'HORIZ' : (ROLE_COLORS[r] ? r : 'DIAG');
}
function barMat(role, isDirect, dim) {
  const k = `${role}|${isDirect ? 1 : 0}|${dim ? 1 : 0}`;
  if (!matCache.has(k)) {
    const base = ROLE_COLORS[role] || 0x9aa7b8;
    const c = new THREE.Color(base);
    if (dim) c.lerp(new THREE.Color(0x10141c), 0.7);
    const s = ROLE_SURFACE[role] || { metalness: 0.4, roughness: 0.55 };
    // 全部杆件（直读与衍生）均为 100% 物理实心实体材质；
    // envMapIntensity 压低环境反射，靠方向光+环境贴图勾出金属边缘轮廓
    matCache.set(k, new THREE.MeshStandardMaterial({
      color: c,
      metalness: s.metalness,
      roughness: s.roughness,
      envMapIntensity: 0.5,
      transparent: false,
      opacity: 1.0,
      depthWrite: true,
    }));
  }
  return matCache.get(k);
}
const id2mesh = new Map();      // model.json component_id → mesh
const meshById = new Map();     // mesh.uuid → {cid, props, src}
const tracedMeshes = [];        // 有图纸实体的杆
const synthMeshes = [];         // 衍生/补全杆
let towerModel = null;          // 当前塔根节点（切塔时从场景移除）
let selected = null;
// 默认展示完整铁塔实体（全部物理实杆均显示）
let onlyTraced = false;

const pickColor = new THREE.Color(0xff5f4e);
const raycaster = new THREE.Raycaster();
raycaster.params.Line.threshold = 0;

function fit(obj) {
  const box = new THREE.Box3().setFromObject(obj);
  const sphere = box.getBoundingSphere(new THREE.Sphere());
  const H = box.max.y;
  const fov = camera.fov * Math.PI / 180;
  const dist = (sphere.radius / Math.tan(fov / 2)) * 1.08;
  controls.target.set(0, H * 0.46, 0);
  camera.position.copy(controls.target).addScaledVector(new THREE.Vector3(0.62, 0.34, 0.72).normalize(), dist);
  // 雾化景深：远侧杆融入背景，近侧清晰——「密而清晰」的关键
  scene.fog = new THREE.Fog(0x10141c, dist * 0.85, dist * 2.6);
  controls.update();
}

function resize() {
  const w = left.clientWidth, h = left.clientHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h; camera.updateProjectionMatrix();
}

async function loadModel(modelJson, gltf) {
  const model = gltf.scene;
  model.rotation.x = -Math.PI / 2;              // 工程 Z-up → three Y-up
  const box = new THREE.Box3().setFromObject(model);
  const center = box.getCenter(new THREE.Vector3());
  model.position.set(-center.x, -box.min.y, -center.z);
  // evidence.json：cid → {role, section, geometry_origin, bar_id, projection_refs, confidence}
  const ev0 = new Map(Object.entries(modelJson));
  model.traverse((o) => {
    if (!o.isMesh) return;
    const ext = o.userData || {};
    const cid = ext.component_id || '';
    if (!cid) { o.material = barMat('LEG', false, false); return; }
    const comp = ev0.get(cid);
    // role 归一化：模型属性里水平杆写作 HORIZONTAL（eval 口径），
    // GLB extras / 着色表用 HORIZ——统一到四键色表，防落默认灰色
    const role = normRole(ext.role || comp?.role);
    const traced = !!(comp?.projection_refs?.length);
    o.material = barMat(role, traced, false);
    (traced ? tracedMeshes : synthMeshes).push(o);
    id2mesh.set(cid, o);
  });
  towerModel = model;
  scene.add(model);
  fit(model);
  resize();

  // 证据索引：component_id → 属性（含 projection_refs → sheet）
  const ev = ev0;
  const h2cid = new Map();   // CLE handle → 塔级杆 id（图纸↔3D 联接键）
  for (const [cid, comp] of ev) {
    for (const r of (comp.projection_refs || [])) {
      if (r.source_component_id && !h2cid.has(r.source_component_id)) h2cid.set(r.source_component_id, cid);
    }
  }
  window.__ev = ev; window.__h2cid = h2cid;
  const nTraced = [...ev.values()].filter((c) => c.projection_refs?.length).length;
  // 直读母体为 0（R8 剪枝塔）时换诚实文案：不宣称「直读+衍生」结构
  document.getElementById('tag').textContent = nTraced > 0
    ? `${tower} · 3D 骨架实体 ${id2mesh.size} 杆（直读母体 ${nTraced} 杆 + 四面对称衍生 ${id2mesh.size - nTraced} 杆） · 点杆双向追溯`
    : `${tower} · 规范骨架 ${id2mesh.size} 杆（槽位去重后净化模型 · 册级图纸高程覆盖 ${[...ev.values()].filter((c) => c.prototype?.mode === 'sheet_cover').length} 杆） · 点杆追溯`;
  return ev;
}

// ---------- 右：图纸 SVG ----------
const svghost = document.getElementById('svghost');
const card = document.getElementById('card');
const sheetBar = document.getElementById('sheetbar');
let overlay = null, curSheet = null, hlEls = [];
const overlayByTower = {};   // tower → Promise<overlay.json 解析结果>
function overlayP() {
  if (!overlayByTower[tower]) overlayByTower[tower] = fetch(`${TRACE()}/overlay.json`).then((r) => r.json());
  return overlayByTower[tower];
}

function curSheets() { return TOWERS[tower].sheets.map((s) => `${tower}-${s}`); }

function addSheetButtons() {
  // 塔型切换（左端）
  const towerWrap = document.createElement('span');
  towerWrap.style.cssText = 'display:flex;gap:6px;margin-right:10px;padding-right:10px;border-right:1px solid #2a3547';
  for (const [tid, cfg] of Object.entries(TOWERS)) {
    const b = document.createElement('button');
    b.className = 'tower-btn'; b.id = `tower-${tid}`;
    b.textContent = tid; b.title = cfg.label;
    b.onclick = () => switchTower(tid);
    towerWrap.appendChild(b);
  }
  sheetBar.appendChild(towerWrap);
  // 图纸按钮（随塔重建）
  const sheetWrap = document.createElement('span');
  sheetWrap.id = 'sheetwrap';
  sheetWrap.style.cssText = 'display:flex;gap:6px;flex-wrap:wrap;align-items:center';
  sheetBar.appendChild(sheetWrap);
  addSheetButtonsForTower();
  // 3D 显示模式切换
  const bt = document.createElement('button');
  bt.id = 'btn-traced';
  bt.textContent = '☐ 仅直读杆高亮';
  bt.onclick = () => { onlyTraced = !onlyTraced; bt.textContent = (onlyTraced ? '☑' : '☐') + ' 仅直读杆高亮'; applyOnlyTraced(); };
  const bwrap = document.createElement('span');
  bwrap.style.cssText = 'margin-left:auto;display:flex;gap:6px;align-items:center';
  bwrap.appendChild(bt);
  const stat = document.createElement('span');
  stat.className = 'stat'; stat.id = 'sheetstat';
  stat.style.marginLeft = '12px';
  sheetBar.appendChild(bwrap);
  sheetBar.appendChild(stat);
}

function addSheetButtonsForTower() {
  const wrap = document.getElementById('sheetwrap');
  wrap.innerHTML = '';
  curSheets().forEach((sid) => {
    const b = document.createElement('button');
    b.className = 'sheet-btn';
    b.textContent = '图 ' + sid.slice(tower.length + 1);
    b.onclick = () => showSheet(sid);
    wrap.appendChild(b);
  });
}

let sheetSeq = 0;   // showSheet 并发防护：旧请求晚到不允许覆盖新状态
async function showSheet(sid) {
  const seq = ++sheetSeq;
  curSheet = sid;
  sheetBar.querySelectorAll('.sheet-btn').forEach((b, i) => b.classList.toggle('on', curSheets()[i] === sid));
  const [svgText, ovAll] = await Promise.all([
    fetch(`${TRACE()}/${sid}.svg`).then((r) => r.text()),
    overlayP(),
  ]);
  if (seq !== sheetSeq) return;   // 过期响应丢弃
  overlay = ovAll[sid] || {};
  svghost.innerHTML = svgText;
  const svg = svghost.querySelector('svg');
  enablePanZoom(svg);
  // overlay 折线注入 <g id="hl">
  const hl = svg.querySelector('#hl');
  hl.innerHTML = '';
  hlEls = [];
  for (const [cid, o] of Object.entries(overlay)) {
    const pts = o.pts.map((p) => p.join(',')).join(' ');
    const pl = document.createElementNS('http://www.w3.org/2000/svg', 'polyline');
    pl.setAttribute('points', pts);
    pl.setAttribute('fill', 'none');
    pl.setAttribute('stroke', 'rgba(255,212,121,0.14)');
    pl.setAttribute('stroke-width', '1');
    pl.dataset.cid = cid;
    pl.style.cursor = 'pointer';
    pl.addEventListener('click', () => focus3D(cid));
    pl.addEventListener('mouseenter', () => glowSVG(pl, true));
    pl.addEventListener('mouseleave', () => glowSVG(pl, false));
    hl.appendChild(pl);
    hlEls.push(pl);
  }
  const stat = document.getElementById('sheetstat');
  if (stat) stat.textContent = `${sid} · 可追溯杆 ${hlEls.length}`;
  // 背景原生图元索引（供点击 3D 杆后的黄色高亮）
  bgIndex = indexBackground(svg);
  bgIndex.byH = new Map();
  for (const el of svg.querySelectorAll('#bg > [data-h]')) {
    const h = el.getAttribute('data-h');
    if (!bgIndex.byH.has(h)) bgIndex.byH.set(h, []);
    bgIndex.byH.get(h).push(el);
  }
  bgIndex.all = new Set(svg.querySelectorAll('#bg > [data-h]'));
  dimEls = [];   // 换图后压暗列表失效
}

// SVG pan/zoom（滚轮缩放 + 拖拽平移；origin 固定左上角，translate/scale 才是线性对应）
function enablePanZoom(svg) {
  svg.style.transformOrigin = '0 0';
  let scale = 1, tx = 0, ty = 0, pan = null;
  const apply = () => { svg.style.transform = `translate(${tx}px,${ty}px) scale(${scale})`; };
  svg.onwheel = (e) => {
    e.preventDefault();
    const r = svg.getBoundingClientRect();
    const mx = e.clientX - r.left, my = e.clientY - r.top;
    const k = e.deltaY < 0 ? 1.15 : 1 / 1.15;
    tx = mx - k * (mx - tx); ty = my - k * (my - ty);
    scale *= k; apply();
  };
  svg.onmousedown = (e) => { pan = { x: e.clientX - tx, y: e.clientY - ty }; };
  svg.onmousemove = (e) => { if (pan) { tx = e.clientX - pan.x; ty = e.clientY - pan.y; apply(); } };
  svg.onmouseup = svg.onmouseleave = () => { pan = null; };
}

function glowSVG(el, on) {
  el.setAttribute('stroke', on ? '#ffd479' : 'rgba(255,212,121,0.14)');
  el.setAttribute('stroke-width', on ? 3 : 1);
}

// ---------- 原生 CAD 图元黄色高亮 ----------
// 联接三层：① source_component_id=DXF handle（ZC1 多数册）→ data-h 直接点亮；
// ② CLE 合成中心线（JC1 全部/ZC1 部分，DXF 无同名实体）→ 以 overlay 折线为
//    走廊几何匹配双线角钢边 + 螺栓孔 + 件号文字；③ sheet_cover → 只给该杆
//    3D 位置所在的图纸区段画黄框（册级诚实降级）。
let bgIndex = null;      // {lines:[{h,x1,y1,x2,y2,len}], circles:[{h,cx,cy,r}], texts:[{h,x,y,w,txt}]}
let cadHlEls = [];       // 当前黄色图元
let dimEls = [];         // 焦点模式下被压暗的其余图元

function indexBackground(svg) {
  const idx = { lines: [], circles: [], texts: [] };
  for (const el of svg.querySelectorAll('#bg > [data-h]')) {
    const tag = el.tagName;
    const h = el.getAttribute('data-h');
    if (tag === 'line') {
      const x1 = +el.getAttribute('x1'), y1 = +el.getAttribute('y1');
      const x2 = +el.getAttribute('x2'), y2 = +el.getAttribute('y2');
      idx.lines.push({ h, el, x1, y1, x2, y2, len: Math.hypot(x2 - x1, y2 - y1) });
    } else if (tag === 'path' || tag === 'circle') {
      // path 走 bbox 近似（单杆匹配走廊足够）；circle 精确圆心半径
      if (tag === 'circle') {
        idx.circles.push({ h, el, cx: +el.getAttribute('cx'), cy: +el.getAttribute('cy'),
                           r: +el.getAttribute('r') });
      } else {
        let bb; try { bb = el.getBBox(); } catch { continue; }
        if (bb.width === 0 && bb.height === 0) continue;
        idx.lines.push({ h, el, x1: bb.x, y1: bb.y, x2: bb.x + bb.width, y2: bb.y + bb.height,
                         len: Math.hypot(bb.width, bb.height), bbox: true });
      }
    } else if (tag === 'text') {
      let bb; try { bb = el.getBBox(); } catch { continue; }
      idx.texts.push({ h, el, cx: bb.x + bb.width / 2, cy: bb.y + bb.height / 2,
                       rad: Math.max(bb.width, bb.height) / 2, txt: el.textContent });
    }
  }
  return idx;
}

// 点 (px,py) 到线段 ab 的距离
function ptSegDist(px, py, x1, y1, x2, y2) {
  const vx = x2 - x1, vy = y2 - y1;
  const L2 = vx * vx + vy * vy;
  const t = L2 ? Math.max(0, Math.min(1, ((px - x1) * vx + (py - y1) * vy) / L2)) : 0;
  return Math.hypot(px - (x1 + t * vx), py - (y1 + t * vy));
}

// overlay 折线 → 命中的原生图元集合（纯几何：方向一致 + 走廊贴近 + 跨度覆盖）
function matchCadElements(pts, idx) {
  const hits = new Map();   // element → true
  const K = [];             // 折线拐点（两点即线段）
  for (const p of pts) K.push({ x: p[0], y: p[1] });
  const ax = K[0].x, ay = K[0].y;
  const vx = K[K.length - 1].x - ax, vy = K[K.length - 1].y - ay;
  const totalLen = Math.hypot(vx, vy);
  const CORRIDOR = 14;      // 图纸 mm：双线角钢半宽 + 提取容差
  const WIDE = 22;          // 宽走廊：图纸画法与中心线偏差较大的分册（06 册实测）
  const ANG_TOL = 12;       // 角度容差（度）
  const tAng = Math.atan2(vy, vx) * 180 / Math.PI;

  for (const L of idx.lines) {
    if (L.len < totalLen * 0.12 || L.len < 20) continue;   // 忽略过短碎线
    const angL = Math.atan2(L.y2 - L.y1, L.x2 - L.x1) * 180 / Math.PI;
    let dAng = Math.abs(angL - tAng) % 180;
    if (dAng > 90) dAng = 180 - dAng;
    if (dAng > ANG_TOL) continue;
    const d1 = ptSegDist(ax, ay, L.x1, L.y1, L.x2, L.y2);
    const d2 = ptSegDist(K[K.length - 1].x, K[K.length - 1].y, L.x1, L.y1, L.x2, L.y2);
    if (d1 <= CORRIDOR && d2 <= CORRIDOR) { hits.set(L.el, 'line'); continue; }
    // 宽走廊补捞：中点贴近 + 在杆轴上的纵向投影与自身长度重叠过半（挡掉交叉斜材）
    const mx = (L.x1 + L.x2) / 2, my = (L.y1 + L.y2) / 2;
    if (ptSegDist(mx, my, ax, ay, ax + vx, ay + vy) > WIDE) continue;
    if (L.len < totalLen * 0.2) continue;
    const t1 = ((L.x1 - ax) * vx + (L.y1 - ay) * vy) / (totalLen * totalLen);
    const t2 = ((L.x2 - ax) * vx + (L.y2 - ay) * vy) / (totalLen * totalLen);
    const lo = Math.min(t1, t2), hi = Math.max(t1, t2);
    const inBand = Math.min(hi, 1) - Math.max(lo, 0);
    if (inBand <= 0) continue;
    const selfIn = Math.min(L.len, (hi - lo) * totalLen);
    if (selfIn > 0 && inBand * totalLen >= 0.5 * selfIn) hits.set(L.el, 'line');
  }
  // 螺栓孔 / 中心圆：贴近走廊的圆
  for (const C of idx.circles) {
    const d = ptSegDist(C.cx, C.cy, ax, ay, ax + vx, ay + vy);
    if (d <= CORRIDOR + C.r) hits.set(C.el, 'circle');
  }
  // 件号文字：折线端头附近（真杆件号都标在端部）
  for (const T of idx.texts) {
    const d = Math.min(ptSegDist(T.cx, T.cy, ax, ay, ax, ay),
                       ptSegDist(T.cx, T.cy, ax + vx, ay + vy, ax + vx, ay + vy)) - T.rad;
    if (d <= 26) hits.set(T.el, 'text');
  }
  return [...hits.keys()];
}

function clearCadHighlight() {
  for (const el of cadHlEls) el.classList.remove('cad-hl');
  for (const el of dimEls) el.classList.remove('cad-dim');
  cadHlEls = []; dimEls = [];
}

// 主入口：把某杆的原型图元点亮为黄色（可选 zoom 聚焦第一个命中）
// 时序防护：showSheet 是 async——索引还属于上一张图时先等它完成再绘制，
// 且只有当该杆的图纸仍是当前图时才落笔（过期绘制丢弃）。恒返回 Promise。
function highlightCad(cid, zoom) {
  clearCadHighlight();
  if (!bgIndex) return Promise.resolve(0);
  const ev = barEvidence(cid);
  if (!ev || !ev.sheet || ev.mode === 'sheet_cover') return Promise.resolve(0);   // 册级覆盖不声明单杆图元
  if (curSheet !== ev.sheet) {
    return showSheet(ev.sheet).then(() => {
      if (curSheet === ev.sheet && selected && selected.cid === cid) return paintCad(cid, ev, zoom);
      return 0;
    });
  }
  return Promise.resolve(paintCad(cid, ev, zoom));
}

function paintCad(cid, ev, zoom) {
  clearCadHighlight();
  // ① handle 是 DXF 实体 handle：直接点亮（可能多条同 handle 图元）
  let els = [];
  const direct = ev.handle && bgIndex.byH.get(ev.handle);
  if (direct) els = direct;

  // ② CLE 合成中心线 / 其余模式：overlay 折线几何匹配
  if (!els.length && ev.handle) {
    const ov = overlay[cid] || Object.values(overlay).find((o) => o.handle === ev.handle);
    if (ov && ov.pts) els = matchCadElements(ov.pts, bgIndex);
  }

  if (els.length) {
    for (const el of els) el.classList.add('cad-hl');
    cadHlEls = els;
    // 焦点模式：其余背景图元压暗，黄色即视觉焦点
    const hlSet = new Set(els);
    dimEls = [...bgIndex.all].filter((el) => !hlSet.has(el));
    for (const el of dimEls) el.classList.add('cad-dim');
    if (zoom) zoomToBBox(els);
    return els.length;
  }
  return 0;
}

function zoomToBBox(els) {
  const svg = svghost.querySelector('svg');
  const host = svghost.getBoundingClientRect();
  const vb = svg.viewBox.baseVal;
  const fit = Math.min(host.width / vb.width, host.height / vb.height);
  const ox = (host.width - vb.width * fit) / 2;
  const oy = (host.height - vb.height * fit) / 2;
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const el of els) {
    let bb; try { bb = el.getBBox(); } catch { continue; }
    if (!isFinite(bb.width)) continue;
    x0 = Math.min(x0, bb.x); y0 = Math.min(y0, bb.y);
    x1 = Math.max(x1, bb.x + bb.width); y1 = Math.max(y1, bb.y + bb.height);
  }
  if (!isFinite(x0)) return;
  const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
  const px = (cx - vb.x) * fit + ox, py = (cy - vb.y) * fit + oy;
  const segPx = Math.max(Math.hypot(x1 - x0, y1 - y0) * fit, 60);
  const scale = Math.max(0.6, Math.min(30, (Math.min(host.width, host.height) * 0.45) / segPx));
  svg.style.transform = `translate(${host.width / 2 - px * scale}px, ${host.height / 2 - py * scale}px) scale(${scale})`;
}


// 「仅直读杆高亮」开关：保持全塔物理实体可见，切换直读杆突出状态
function applyOnlyTraced() {
  const ev = window.__ev;
  for (const o of tracedMeshes) {
    const comp = ev.get(o.userData.component_id);
    o.material = barMat(normRole(o.userData.role || comp?.role), true, false);
    o.visible = true;
  }
  for (const o of synthMeshes) {
    o.visible = true;  // 实体实杆始终完整可见
    const comp = ev.get(o.userData.component_id);
    const role = normRole(o.userData.role || comp?.role);
    // 仅直读杆高亮时，衍生杆微降亮度但不透明
    o.material = barMat(role, false, onlyTraced);
  }
  if (selected) clearSel3D();
  document.getElementById('btn-traced')?.classList.toggle('on', onlyTraced);
}
function clearSel3D() {
  if (selected) selected.mesh.material.emissive && selected.mesh.material.emissive.setHex(0);
  selected = null;
  card.style.display = 'none';
  clearSVGHighlight();
  clearCadHighlight();
}

// ---------- 联动 ----------
function barEvidence(cid) {
  const comp = window.__ev && window.__ev.get(cid);
  if (!comp) return null;
  const p = comp;
  const proto = p.prototype || null;   // 导出器四级解析：direct/mirror/side/sheet_cover
  let ref = (p.projection_refs || []).find((r) => r.sheet_id) || null;
  let isDerived = false;
  let sheet = null, handle = null, mode = null;

  if (ref) {
    // 直读杆：自己的 projection_refs
    sheet = ref.sheet_id; handle = ref.source_component_id; mode = 'direct';
  } else if (proto && proto.sheet) {
    sheet = proto.sheet; handle = proto.handle || null; mode = proto.mode;
    isDerived = mode === 'mirror' || mode === 'side';
  } else {
    // 兜底：通过 derived_from/root_bar_id 找母体直读杆（旧 evidence 数据兼容）
    const motherKey = p.derived_from || p.root_bar_id;
    if (motherKey) {
      for (const cand of [motherKey, `4f_${motherKey}_F`, `4f_${motherKey}`, String(motherKey).replace(/_[BLR]$/, '_F')]) {
        const parent = window.__ev.get(cand);
        if (parent && parent.projection_refs?.length) {
          ref = parent.projection_refs.find((r) => r.sheet_id) || null;
          if (ref) {
            sheet = ref.sheet_id; handle = ref.source_component_id;
            isDerived = true; mode = 'mirror';
            break;
          }
        }
      }
    }
  }

  return {
    cid,
    bar_id: p.bar_id || '—',
    section: p.section || '—',
    role: p.role || '—',
    origin: p.geometry_origin || '—',
    sheet, handle, mode,
    confidence: p.confidence,
    isDerived,
  };
}

// 联接键：CLE handle（3D 杆 projection_refs 与图纸 overlay 同源）
function highlightByHandle(handle, pan) {
  if (!handle) return false;
  const el = hlEls.find((x) => (overlay[x.dataset.cid] || {}).handle === handle);
  if (!el) return false;
  el.classList.add('hl-bar');
  el.setAttribute('stroke', '#ffd479');
  el.setAttribute('stroke-width', 3);
  if (pan) zoomToLine(el);
  return true;
}

function showCard(cid, ev) {
  const originCn = {
    dxf_geom: '直读 DXF 实线', leg_synth: '主腿合成', diag_synth: '斜材合成',
    marker_synth: '短划合成', diag_complete: '斜材补全', leg_chain_stitch: '腿链缝合',
    derived_4face: '对称四面实杆', derived_parametric_base: '参数化补全实杆',
    diaphragm_reconstructed: '横隔实杆', terminal_pair_gen: '端对生成实杆',
    panel_template_completion: '节间模板实杆', crossarm_truss_completion: '横担实杆',
    boundary_leg_bridge: '边界腿桥接', side_direct: '侧视直读', side_mirror: '侧视镜像',
  }[ev.origin] || ev.origin;
  // 诚实分级标签：direct/side = 有单根图元原型；mirror = 母体图元对称复制；
  // sheet_cover = 该杆高程由某分册立面覆盖（仅册级关联，不声明单根图元）。
  const MODE_LABEL = {
    direct: '来源图纸', mirror: '母体图纸', side: '来源图纸（侧视）',
    sheet_cover: '高程覆盖图纸',
  };
  const MODE_BTN = {
    direct: '在图纸上查看 →', mirror: '查看母体图元 →',
    side: '在侧视图中查看 →', sheet_cover: '查看该高程图纸区段 →',
  };
  const sheetLabel = ev.sheet ? (MODE_LABEL[ev.mode] || '来源图纸') : null;
  card.style.display = 'block';
  card.innerHTML =
    `<h4>件号 ${ev.bar_id} · ${ev.role}</h4><table>` +
    `<tr><td>截面</td><td>${ev.section}</td></tr>` +
    `<tr><td>构件类型</td><td><b>物理实体实杆</b>（${originCn}）</td></tr>` +
    (ev.isDerived ? `<tr><td>衍生血统</td><td class="src">由母体图元对称复制/侧视生成</td></tr>` : '') +
    (ev.sheet ? `<tr><td>${sheetLabel}</td><td class="src">${ev.sheet}${ev.handle ? ' · ' + ev.handle : ''}</td></tr>` : '') +
    (ev.confidence != null ? `<tr><td>置信度</td><td>${ev.confidence}</td></tr>` : '') +
    `</table>` +
    (ev.sheet
      ? `<div style="margin-top:8px"><button id="goto" style="background:#2c4a86;color:#fff;border:0;border-radius:7px;padding:5px 14px;cursor:pointer;font:inherit">${MODE_BTN[ev.mode] || '在图纸上查看 →'}</button></div>`
      : `<div style="margin-top:8px;color:#71809a">空间实体构件（基于规程/高程拓扑推导）</div>`);
  const goto = document.getElementById('goto');
  if (goto) goto.onclick = async () => {
    await highlightCad(cid, true);
    highlightByHandle(ev.handle, true);
  };
}

// sheet_cover / 无 handle 跳转：await showSheet 后无单根图元可高亮（诚实降级，册级关联）

// 3D 点杆 → 图纸高亮
renderer.domElement.addEventListener('pointerdown', (e) => {
  if (e.button !== 0) return;
  const r = renderer.domElement.getBoundingClientRect();
  const m = new THREE.Vector2(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  raycaster.setFromCamera(m, camera);
  const meshes = [...id2mesh.values()];
  const hit = raycaster.intersectObjects(meshes, false)[0];
  if (!hit) return;
  select3D(hit.object);
});

function select3D(mesh, scroll) {
  if (selected) selected.mesh.material.emissive && selected.mesh.material.emissive.setHex(0);
  selected = { cid: mesh.userData.component_id, mesh };
  mesh.material.emissive && mesh.material.emissive.setHex(0x7a2a10);
  const ev = barEvidence(selected.cid);
  if (ev) showCard(selected.cid, ev);
  clearSVGHighlight();
  if (ev && ev.sheet) {
    // highlightCad 内部处理换图时序（含过期绘制丢弃）
    highlightCad(selected.cid, true).then(() => highlightByHandle(ev.handle, true));
  } else {
    clearCadHighlight();
  }
}

function clearSVGHighlight() {
  hlEls.forEach((el) => { el.classList.remove('hl-bar'); glowSVG(el, false); });
}

function highlightSVG(cid, pan) {
  const el = hlEls.find((x) => x.dataset.cid === cid);
  if (!el) return;
  el.classList.add('hl-bar');
  el.setAttribute('stroke', '#ffd479');
  el.setAttribute('stroke-width', 3);
  if (pan) zoomToLine(el);
}

// 图纸点黄线 → 3D 定位（sheet 级 cid 经 handle 映射回塔级杆）
function focus3D(sheetCid) {
  const handle = (overlay[sheetCid] || {}).handle;
  const cid = (handle && window.__h2cid.get(handle)) || sheetCid;
  const mesh = id2mesh.get(cid);
  if (mesh) {
    controls.target.copy(mesh.getWorldPosition(new THREE.Vector3()));
    camera.position.sub(controls.target).setLength(22000).add(controls.target);
    controls.update();
    select3D(mesh, false);
  }
}

function zoomToLine(el) {
  const svg = svghost.querySelector('svg');
  const host = svghost.getBoundingClientRect();       // 宿主未变换矩形
  const vb = svg.viewBox.baseVal;
  const fit = Math.min(host.width / vb.width, host.height / vb.height);
  const ox = (host.width - vb.width * fit) / 2;       // preserveAspectRatio 留白
  const oy = (host.height - vb.height * fit) / 2;
  const pts = el.getAttribute('points').trim().split(/\s+/).map((s) => s.split(',').map(Number));
  const xs = pts.map((p) => p[0]), ys = pts.map((p) => p[1]);
  const cx = (Math.min(...xs) + Math.max(...xs)) / 2;
  const cy = (Math.min(...ys) + Math.max(...ys)) / 2;
  // viewBox 坐标 → 未变换元素像素
  const px = (cx - vb.x) * fit + ox, py = (cy - vb.y) * fit + oy;
  const seg = Math.max(...xs) - Math.min(...xs), segy = Math.max(...ys) - Math.min(...ys);
  const segPx = Math.max(Math.hypot(seg, segy) * fit, 60);
  const scale = Math.max(0.6, Math.min(30, (Math.min(host.width, host.height) * 0.45) / segPx));
  svg.style.transform = `translate(${host.width / 2 - px * scale}px, ${host.height / 2 - py * scale}px) scale(${scale})`;
}

// ---------- 分栏拖动 ----------
const divid = document.getElementById('divid');
divid.onmousedown = (e) => {
  e.preventDefault();
  const move = (ev) => {
    const total = innerWidth;
    const lp = Math.min(total * 0.75, Math.max(total * 0.25, ev.clientX));
    left.style.flex = `0 0 ${lp}px`;
    right_Flex(lp);
    resize();
  };
  const up = () => { removeEventListener('mousemove', move); removeEventListener('mousemove', up); };
  addEventListener('mousemove', move); addEventListener('mousemove', up);
};
function right_Flex() {}

new ResizeObserver(resize).observe(left);
resize();

// ---------- 启动 / 切塔 ----------
addSheetButtons();
async function loadTower(tid) {
  tower = tid;
  // 清 3D 场景旧塔与状态
  if (towerModel) { scene.remove(towerModel); towerModel = null; }
  id2mesh.clear(); tracedMeshes.length = 0; synthMeshes.length = 0;
  clearSel3D();
  // 图纸按钮重建 + 状态栏
  addSheetButtonsForTower();
  curSheet = null;
  document.getElementById('sheetstat').textContent = '加载中…';
  sheetBar.querySelectorAll('.tower-btn').forEach((b) => b.classList.toggle('on', b.id === `tower-${tid}`));
  const [modelJson, gltf] = await Promise.all([
    fetch(`${TRACE()}/evidence.json`).then((r) => r.json()),
    new GLTFLoader().loadAsync(`${TRACE()}/tower.glb`),
  ]);
  const ev = await loadModel(modelJson, gltf);
  applyOnlyTraced();
  await showSheet(curSheets()[0]);
  return ev;
}
async function switchTower(tid) {
  if (tid === tower || document.getElementById('tag').dataset.busy) return;
  document.getElementById('tag').dataset.busy = '1';
  document.getElementById('tag').textContent = `${tid} 加载中…`;
  try { await loadTower(tid); } catch (e) {
    document.getElementById('tag').textContent = `${tid} 加载失败：${e && e.message || e}`;
  } finally { delete document.getElementById('tag').dataset.busy; }
}
(async () => {
  try {
    await loadTower('35A2-ZC1');
  } catch (e) {
    const why = location.protocol === 'file:'
      ? '本页通过 file:// 直接打开，浏览器会拦截模型/图纸请求。请通过 http(s) 访问：'
      : '资源加载失败（' + (e && e.message || e) + '）。';
    document.getElementById('tag').innerHTML = why +
      (location.protocol === 'file:'
        ? '<br>在线版：zsn12.github.io/zotero/site/trace.html'
        : '<br>请刷新重试，或确认 trace/ 资产目录可访问。');
  }
})();
addEventListener('resize', resize);
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });

// 测试钩子（亦供控制台演示）：__trace.select(cid) / __trace.focus(cid) / __trace.tower(id)
window.__trace = {
  select(cid) { const m = id2mesh.get(cid); if (m) select3D(m); return !!m; },
  focus: (cid) => focus3D(cid),
  barsWithSheet: () => [...window.__ev.entries()].filter(([, c]) => c.projection_refs?.length).map(([cid]) => cid),
  tower: (tid) => switchTower(tid),
  current: () => tower,
  cadHits: async (cid) => await highlightCad(cid || (selected && selected.cid), false),
};
</script>
